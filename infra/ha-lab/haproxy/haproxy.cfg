# HAProxy for the HA lab (never deployed). The stable endpoint of plan §3.1:
#   pg-rw:5432 → the node whose pg-role-check /primary answers 200
#   pg-ro:5433 → streaming replicas within 16 MB of replay lag (/replica),
#                falling back to the pg-rw nodes when no replica is healthy
# Checks go to each node's role-check sidecar on :8008 (fixed lab IPs, since
# `addr` takes an address). Patroni's REST API answers the same paths on
# :8008, so at Stage 5 only the `addr` values change.

global
    log stdout format raw local0 info
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s
    retries 2

listen stats
    bind :7000
    mode http
    stats enable
    stats uri /
    stats refresh 2s

frontend pg_rw
    bind :5432
    default_backend pg_rw_nodes

frontend pg_ro
    bind :5433
    use_backend pg_ro_replicas if { nbsrv(pg_ro_replicas) gt 0 }
    default_backend pg_rw_nodes

backend pg_rw_nodes
    balance first
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    # Never two writable targets at once: at most one server is used, and a
    # node that stops answering /primary has its sessions cut immediately.
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-primary 172.31.240.11:5432 check addr 172.31.240.21 port 8008
    server pg-replica 172.31.240.12:5432 check addr 172.31.240.22 port 8008

backend pg_ro_replicas
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica?lag=16777216
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-primary 172.31.240.11:5432 check addr 172.31.240.21 port 8008
    server pg-replica 172.31.240.12:5432 check addr 172.31.240.22 port 8008
