name: Build & Deploy (on server)

on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy on Server
    runs-on: ubuntu-latest
    steps:
      # Every release carries a new version (apps/*/package.json move together;
      # the dashboard shows the newest changelog entry's version and the API
      # reports it on /api/health). A version that is already tagged on another
      # commit means nobody bumped it: refuse, so the rule cannot be forgotten.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version must be new
        id: version
        run: |
          VER=$(node -p "require('./apps/admin-ui/package.json').version")
          case "$VER" in
            [0-9].[0-9].[0-9]|[0-9][0-9].[0-9].[0-9]) ;;
            *) echo "::error::version $VER: each component is one digit (2.9.9 → 3.0.0); run node scripts/release.mjs"; exit 1 ;;
          esac
          for app in platform-api website; do
            V=$(node -p "require('./apps/$app/package.json').version")
            if [ "$V" != "$VER" ]; then echo "::error::apps/$app is $V but apps/admin-ui is $VER; run node scripts/release.mjs"; exit 1; fi
          done
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            AT=$(git rev-list -n 1 "v$VER")
            if [ "$AT" != "$GITHUB_SHA" ]; then
              echo "::error::v$VER is already tagged at ${AT:0:12}; bump the version with node scripts/release.mjs <patch|minor|major> before pushing to production"
              exit 1
            fi
          fi
          if ! grep -rqs "version: v$VER" apps/admin-ui/content/changelog/; then
            echo "::error::no changelog entry carries version: v$VER (apps/admin-ui/content/changelog/)"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VER"
      - name: Build & Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 30
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # An SSH key rather than a password: the password is a long-lived
          # secret that also works for an interactive login, and the server
          # still accepts password auth, so anything that learns it has a
          # shell. This key authorises this workflow and nothing else.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # ── Pull latest code ──
            # This checkout is a deploy-only copy; force-sync to origin so a
            # stray local edit can never block the deploy. .env.production is
            # git-ignored and survives the reset.
            echo "=== Pulling latest code ==="
            git fetch origin production
            git checkout -f production
            git reset --hard origin/production

            # ── Deployment secrets ──
            # Compose mounts these as files, so a missing one aborts the whole
            # deploy mid-flight. Generate anything absent before touching any
            # container. Existing files are never overwritten: the Mongo keyfile
            # authenticates replica-set members and replacing it would lock the
            # running set out of itself.
            echo "=== Ensuring deployment secrets exist ==="
            mkdir -p secrets
            if [ ! -f secrets/mongo-keyfile ]; then
              openssl rand -base64 756 > secrets/mongo-keyfile
              chmod 400 secrets/mongo-keyfile
              echo "generated secrets/mongo-keyfile"
            fi

            # ── Login to GHCR ──
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            # ── Build images on server ──
            # The cluster image carries the extensions an imported schema can
            # need. Rebuilding it every deploy would be worse than pointless:
            # the cleanup below wipes the build cache, so the rebuild produces a
            # new image id, compose recreates postgres, and everything that
            # depends on it restarts — including Keycloak, which drops every SSO
            # session. Tag by the Dockerfile's own hash and only build when that
            # changes, so an unchanged cluster image keeps its id and compose
            # leaves the database alone.
            PG_REF=ghcr.io/${{ secrets.GHCR_USER }}/basefyio-postgres
            PG_HASH=$(sha256sum docker/postgres/Dockerfile | cut -c1-12)
            # The hash tag can disappear while the image itself is still the
            # one postgres runs: the host's disk guard prunes unused images
            # with -a when the disk passes 90%. Rebuilding then yields a new id
            # and recreates postgres and Keycloak (that happened on 2026-10-21).
            # Each build records its Dockerfile hash as a label; when the
            # running container's image carries this hash, re-tag it instead.
            # An image built before the label existed has none and is taken as
            # current, since the Dockerfile rarely changes; set
            # FORCE_POSTGRES_BUILD=1 on the host to override.
            PG_RUNNING=$(docker inspect kolaybase-postgres-1 --format '{{.Image}}' 2>/dev/null || true)
            PG_RUNNING_HASH=""
            if [ -n "$PG_RUNNING" ]; then
              PG_RUNNING_HASH=$(docker image inspect "$PG_RUNNING" --format '{{index .Config.Labels "io.basefyio.dockerfile-sha"}}' 2>/dev/null || true)
              [ "$PG_RUNNING_HASH" = "<no value>" ] && PG_RUNNING_HASH=""
            fi
            if docker image inspect "$PG_REF:$PG_HASH" >/dev/null 2>&1; then
              echo "=== Postgres image unchanged ($PG_HASH) ==="
            elif [ -n "$PG_RUNNING" ] && [ "${FORCE_POSTGRES_BUILD:-0}" != "1" ] \
                 && { [ "$PG_RUNNING_HASH" = "$PG_HASH" ] || [ -z "$PG_RUNNING_HASH" ]; }; then
              echo "=== Postgres hash tag missing; re-tagging the running image (${PG_RUNNING_HASH:-unlabelled}) ==="
              docker tag "$PG_RUNNING" "$PG_REF:$PG_HASH"
            else
              echo "=== Building Postgres ($PG_HASH) ==="
              docker build --label "io.basefyio.dockerfile-sha=$PG_HASH" -t "$PG_REF:$PG_HASH" docker/postgres
            fi
            docker tag "$PG_REF:$PG_HASH" "$PG_REF:latest"

            # Every application image gets two tags: the git sha it was built
            # from and :latest. The sha is what gets deployed (IMAGE_TAG below),
            # so the running version is always a known, re-deployable artefact
            # and a rollback is `IMAGE_TAG=<previous sha> … up -d`. :latest is
            # kept so the documented emergency command without IMAGE_TAG still
            # resolves to the newest build.
            SHA=$(git rev-parse --short=12 HEAD)
            OWNER=${{ secrets.GHCR_USER }}
            echo "=== Image tag: $SHA ==="

            echo "=== Building Platform API ==="
            docker build \
              -t ghcr.io/$OWNER/basefyio-api:$SHA \
              -f apps/platform-api/Dockerfile .
            docker tag ghcr.io/$OWNER/basefyio-api:$SHA ghcr.io/$OWNER/basefyio-api:latest

            echo "=== Building Admin UI ==="
            # The publishable key is inlined into the browser bundle at build
            # time, so it has to come from the same file as the secret key the
            # API charges with. It used to come from a CI secret, which still
            # held a test key after the server moved to live Stripe: the card
            # form then failed for every customer while the API looked healthy.
            # Refuse to build a pair that cannot work together.
            env_value() { grep -E "^$1=" .env.production | tail -1 | cut -d= -f2- | tr -d "\"'"; }
            STRIPE_PK=$(env_value NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)
            STRIPE_SK=$(env_value STRIPE_SECRET_KEY)
            if [ -n "$STRIPE_SK" ]; then
              sk_mode=$(echo "$STRIPE_SK" | cut -d_ -f2); pk_mode=$(echo "$STRIPE_PK" | cut -d_ -f2)
              sk_acct=$(echo "$STRIPE_SK" | cut -d_ -f3 | cut -c1-16); pk_acct=$(echo "$STRIPE_PK" | cut -d_ -f3 | cut -c1-16)
              if [ "$sk_mode" != "$pk_mode" ] || [ "$sk_acct" != "$pk_acct" ]; then
                echo "::error::NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (${pk_mode:-unset}) is not from the Stripe account of STRIPE_SECRET_KEY (${sk_mode}); refusing to ship a billing page that cannot take a card"
                exit 1
              fi
              echo "Stripe keys: both ${sk_mode}, same account"
            fi
            # The release stage is inlined into both Next builds, so it comes
            # from .env.production like the Stripe key; unset means beta.
            RELEASE_STAGE_VALUE=$(env_value RELEASE_STAGE)
            echo "Release stage: ${RELEASE_STAGE_VALUE:-beta (default)}"
            docker build \
              -t ghcr.io/$OWNER/basefyio-ui:$SHA \
              --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$STRIPE_PK" \
              --build-arg NEXT_PUBLIC_RELEASE_STAGE="${RELEASE_STAGE_VALUE:-beta}" \
              apps/admin-ui
            docker tag ghcr.io/$OWNER/basefyio-ui:$SHA ghcr.io/$OWNER/basefyio-ui:latest

            echo "=== Building Website ==="
            docker build \
              -t ghcr.io/$OWNER/basefyio-website:$SHA \
              --build-arg NEXT_PUBLIC_SITE_URL=https://basefyio.com \
              --build-arg NEXT_PUBLIC_RELEASE_STAGE="${RELEASE_STAGE_VALUE:-beta}" \
              -f apps/website/Dockerfile .
            docker tag ghcr.io/$OWNER/basefyio-website:$SHA ghcr.io/$OWNER/basefyio-website:latest

            # ── Push to GHCR (backup) ──
            echo "=== Pushing images ==="
            docker push ghcr.io/$OWNER/basefyio-postgres:latest &
            for svc in api ui website; do
              docker push ghcr.io/$OWNER/basefyio-$svc:$SHA &
              docker push ghcr.io/$OWNER/basefyio-$svc:latest &
            done
            wait

            # ── Record the deployed tag ──
            # The compose file reads ${IMAGE_TAG:-latest}. Writing the sha into
            # .env.production means the manual emergency command runs the same
            # build this deploy did, not whatever :latest points at by then. A
            # hex sha is safe to `source`: no < > & | or spaces.
            if grep -q '^IMAGE_TAG=' .env.production; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$SHA/" .env.production
            else
              printf '\nIMAGE_TAG=%s\n' "$SHA" >> .env.production
            fi

            # ── Restore lost image names ──
            # A prune can strip the name from an image a running container
            # still uses; `up -d` then pulls that name, and minio/minio is no
            # longer served anonymously — the v2.9.6 deploy died on it.
            # Same name, same image: nothing is recreated.
            bash scripts/ops/restore-image-names.sh

            # ── Deploy ──
            echo "=== Deploying $SHA ==="
            IMAGE_TAG=$SHA docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

            # ── Cleanup ──
            # Three images are built on the host every deploy and BuildKit keeps
            # each intermediate layer, so "image prune" alone leaves the cache
            # behind — a handful of deploys was enough to take the disk past 90%.
            docker image prune -f
            docker builder prune -af
            # Sha-tagged images are not dangling, so the prune above never frees
            # them. Keep the three newest per image (the running one included);
            # GHCR holds every older build for a rollback.
            for svc in api ui website; do
              docker image ls "ghcr.io/$OWNER/basefyio-$svc" --format '{{.CreatedAt}}\t{{.Tag}}' \
                | grep -v -e $'\tlatest$' -e $'\t<none>$' \
                | sort -r \
                | awk -F'\t' 'NR>3 {print $2}' \
                | xargs -r -I{} docker rmi "ghcr.io/$OWNER/basefyio-$svc:{}" || true
            done
            df -h / | tail -1
            echo "=== Deploy complete ($SHA) ==="

      # The deploy succeeded: this commit is v<version>. Tag it and publish the
      # GitHub Release with the changelog entry as its notes.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            git config user.name "talyaglobal"
            git config user.email "talyaglobal@talyasmart.com"
            git tag -a "v$VER" -m "v$VER" "$GITHUB_SHA"
            git push origin "v$VER"
          fi
          ENTRY=$(grep -rls "version: v$VER" apps/admin-ui/content/changelog/ | head -n 1)
          TITLE=$(sed -n 's/^title: *"\{0,1\}\(.*[^"]\)"\{0,1\}$/\1/p' "$ENTRY" | head -n 1)
          awk 'f&&/^---$/{exit} f{print} /^---$/{c++; if(c==2)f=1}' "$ENTRY" > /tmp/notes.md || true
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "v$VER — ${TITLE:-release}" --notes-file /tmp/notes.md --verify-tag
          fi
          echo "Released v$VER"
